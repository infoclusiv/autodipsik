<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Website Automation Lab</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div>
        <h1>New Website Automation Lab</h1>
        <p class="subtitle">Automation lab with DeepSeek upload gateway and diagnostics</p>
      </div>
      <div class="status-grid">
        <div><span>Status</span><strong id="extension-status">Loading...</strong></div>
        <div><span>Site</span><strong id="current-site">newsite</strong></div>
        <div><span>URL</span><strong id="active-tab-url">Unknown</strong></div>
      </div>
    </header>

    <nav class="tab-bar">
      <button class="tab-button is-active" data-tab="profile">Site Profile</button>
      <button class="tab-button" data-tab="automation">Automation Tester</button>
      <button class="tab-button" data-tab="diagnostics">Diagnostics</button>
    </nav>

    <main class="panel-stack">
      <section class="panel is-active" data-panel="profile">
        <div id="profile-editor-root"></div>
      </section>
      <section class="panel" data-panel="automation">
        <div id="automation-tester-root"></div>
      </section>
      <section class="panel" data-panel="diagnostics">
        <div id="diagnostics-root"></div>
      </section>
    </main>
  </div>

  <script src="../core/config.js"></script>
  <script src="../core/constants/messageTypes.js"></script>
  <script src="../core/constants/storageKeys.js"></script>
  <script src="../core/constants/telemetryEvents.js"></script>
  <script src="../core/constants.js"></script>
  <script src="../core/errors.js"></script>
  <script src="../core/storage.js"></script>
  <script src="../core/telemetry.js"></script>
  <script src="../core/observabilityContracts.js"></script>
  <script src="../core/causalDiagnostics/causalContracts.js"></script>
  <script src="../core/causalDiagnostics/workflowStateTracker.js"></script>
  <script src="../core/contracts/messageContracts.js"></script>
  <script src="../core/contracts/backgroundContracts.js"></script>
  <script src="../core/contracts/deepseekWorkflowContracts.js"></script>
  <script src="../core/contracts/gatewayContracts.js"></script>
  <script src="../core/causalDiagnostics/causalDecisionTree.js"></script>
  <script src="../core/diagnosticRedactor.js"></script>
  <script src="../core/diagnosticExporter.js"></script>
  <script src="../sites/newsite/config.js"></script>
  <script src="../sites/newsite/contracts.js"></script>
  <script src="../sites/newsite/siteProfile.js"></script>
  <script src="../sites/deepseek/config.js"></script>
  <script src="../sites/deepseek/siteProfile.js"></script>
  <script src="shared/dom.js"></script>
  <script src="shared/toast.js"></script>
  <script src="shared/logView.js"></script>
  <script src="shared/chromeMessaging.js"></script>
  <script src="profileEditor/profileEditor.store.js"></script>
  <script src="profileEditor/profileEditor.render.js"></script>
  <script src="profileEditor/profileEditor.controller.js"></script>
  <script src="automationTester/automationTester.store.js"></script>
  <script src="automationTester/automationRunOrchestrator.js"></script>
  <script src="automationTester/automationTester.render.js"></script>
  <script src="automationTester/automationTester.controller.js"></script>
  <script src="diagnostics/diagnostics.store.js"></script>
  <script src="diagnostics/diagnostics.render.js"></script>
  <script src="diagnostics/diagnostics.controller.js"></script>
  <script src="bootstrap.js"></script>
</body>
</html>
